name: Publicar jogo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Testar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Testar o jogo
        run: npm test
      - name: Gerar versão de produção
        run: npm run build
      - name: Verificar caminhos para GitHub Pages
        run: node scripts/check-build.js
      - name: Enviar somente o build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verificar configuração do Pages
        uses: actions/configure-pages@v5
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
